<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

            .login-container h2 {
                margin-bottom: 24px;
            }

            .login-container input {
                width: 100%;
                padding: 12px;
                margin-bottom: 16px;
                border: 1px solid #ccc;
                border-radius: 6px;
            }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

            .options label {
                display: flex;
                align-items: center;
                gap: 5px;
            }

            .options a {
                color: #007bff;
                text-decoration: none;
            }

                .options a:hover {
                    text-decoration: underline;
                }

        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

            .login-container button:hover {
                background-color: #0056b3;
            }

        .register-link {
            margin-top: 16px;
            font-size: 14px;
        }

            .register-link a {
                color: #007bff;
                text-decoration: none;
            }

                .register-link a:hover {
                    text-decoration: underline;
                }

        #response {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Sign in to your account</h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required />
            <input type="password" id="loginPassword" placeholder="Password" required />
            <div class="options">
                <label>
                    <input type="checkbox" id="rememberMe" />
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit">Login</button>
        </form>
        <p class="register-link">Don't have an account? <a href="/register.html">Register here</a></p>
        <div id="response"></div>
    </div>

    <script>
        const apiUrl = "/api/auth"; // relative URL: works no matter which port profile is running

        const showResponse = (message, isSuccess = true) => {
            const resp = document.getElementById("response");
            resp.className = isSuccess ? "success" : "error";
            resp.textContent = message;
            resp.style.display = "block";

            setTimeout(() => {
                resp.style.display = "none";
            }, 3000);
        };

        // Decodes a JWT payload client-side. This is only used to decide which
        // page to redirect to - it is NOT a security check. The API always
        // re-validates the token and role on every protected request.
        const parseJwt = (token) => {
            try {
                const base64Url = token.split(".")[1];
                const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split("")
                        .map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
                        .join("")
                );
                return JSON.parse(jsonPayload);
            } catch {
                return null;
            }
        };

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await fetch(`${apiUrl}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    const text = await res.text();
                    showResponse("Login: " + text, false);
                    return;
                }

                const data = await res.json();
                const claims = parseJwt(data.token);
                const role = claims ? claims.role : null;

                localStorage.setItem("authToken", data.token);
                localStorage.setItem("loggedEmail", email);

                showResponse("Login successful", true);

                window.location.href = role === "Admin" ? "/admin.html" : "/dashboard.html";
            }

            catch (error) {
                console.error("Login error:", error);
                showResponse("Error connecting to the server.", false);
            }
        });
    </script>
</body>
</html>
